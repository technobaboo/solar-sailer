[package]
name = "solar-sailer"
version = "0.52.0"
edition = "2024"

[dependencies]
glam = { version = "0.33.7", features = ["mint"] }
mint = "0.5.9"
tokio = { version = "1.32.0", features = ["rt", "tokio-macros", "sync"] }
tracing = "0.1.41"
tokio-stream = "0.1.17"
